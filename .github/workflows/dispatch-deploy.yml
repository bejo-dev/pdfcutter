name: Dispatch deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tool deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            repos/bejo-dev/tools-deploy/dispatches \
            --raw-field event_type=deploy-tool \
            --raw-field "client_payload[tool]=pdfcutter" \
            --raw-field "client_payload[source_ref]=$SOURCE_REF" \
            --raw-field "client_payload[source_sha]=$SOURCE_SHA"
