name: Dispatch deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BEJO_DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.BEJO_DEV_APP_PRIVATE_KEY }}
          owner: bejo-dev
          repositories: tools-deploy
          permission-contents: write

      - name: Dispatch tool deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            repos/bejo-dev/tools-deploy/dispatches \
            --raw-field event_type=deploy-tool \
            --raw-field "client_payload[tool]=pdfcutter" \
            --raw-field "client_payload[source_ref]=$SOURCE_REF" \
            --raw-field "client_payload[source_sha]=$SOURCE_SHA"
